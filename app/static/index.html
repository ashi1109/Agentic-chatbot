<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Minimal Chatbot Platform</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- AUTH SCREEN -->
<section id="auth-section" class="centered">
  <div class="card">
    <h1>Chatbot Platform</h1>
    <div class="tabs">
      <button id="tab-login" class="tab active">Login</button>
      <button id="tab-register" class="tab">Register</button>
    </div>

    <form id="login-form">
      <input type="email" id="login-email" placeholder="Email" required />
      <input type="password" id="login-password" placeholder="Password" required />
      <button type="submit">Log in</button>
    </form>

    <form id="register-form" class="hidden">
      <input type="email" id="register-email" placeholder="Email" required />
      <input type="password" id="register-password" placeholder="Password (min 6 chars)" required minlength="6" />
      <button type="submit">Create account</button>
    </form>

    <p id="auth-error" class="error hidden"></p>
  </div>
</section>

<!-- MAIN APP -->
<section id="app-section" class="hidden">
  <aside class="sidebar">
    <div class="sidebar-header">
      <span id="user-email"></span>
      <button id="logout-btn" class="link-btn">Log out</button>
    </div>

    <h2>Projects</h2>
    <form id="new-project-form">
      <input type="text" id="new-project-name" placeholder="New project name" required />
      <button type="submit">+ Create</button>
    </form>

    <ul id="project-list"></ul>
  </aside>

  <main class="chat-area">
    <div id="no-project" class="empty-state">Select or create a project to start chatting.</div>

    <div id="project-view" class="hidden">
      <div class="project-header">
        <input id="project-name-input" type="text" />
        <button id="save-project-btn">Save</button>
        <button id="delete-project-btn" class="danger">Delete</button>
      </div>
      <textarea id="project-prompt-input" placeholder="System prompt for this agent..." rows="3"></textarea>

      <div id="messages" class="messages"></div>

      <form id="chat-form" class="chat-form">
        <input type="text" id="chat-input" placeholder="Type a message..." autocomplete="off" required />
        <button type="submit">Send</button>
      </form>
    </div>
  </main>
</section>

<script src="app.js"></script>
</body>
</html>
